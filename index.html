<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NexoraOS™ Intelligent Enterprise Operating System" />
    <meta property="og:description" content="One Platform. One Organization. One Vision. — 15 integrated enterprise domains for humanitarian operations management." />
    <meta property="og:image" content="/LogoRohamaab.png" />
    <meta property="og:locale" content="ar_YE" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NexoraOS™ | رُحماء بينهم" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="format-detection" content="telephone=no" />
    <meta name="application-name" content="NexoraOS" />
    <meta name="theme-color" content="#059669" media="(prefers-color-scheme: light)" />

    <!-- Preload brand logo: primary LCP element of the login gateway -->
    <link rel="preload" as="image" href="/LogoRohamaab.png" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body class="bg-slate-50 dark:bg-zinc-950 text-slate-900 dark:text-zinc-100 antialiased overflow-x-hidden">
