services:
  - type: web
    name: nexoraos
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: node dist/server.cjs
    healthCheckPath: /api/v2/health/liveness
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://erprbdcye.org,https://www.erprbdcye.org
      - key: CORS_ORIGINS
        value: https://erprbdcye.org,https://www.erprbdcye.org
      - key: DB_POOL_MAX
        value: 10
      - key: DB_SSL_STRICT
        value: true
      - key: REDIS_URL
        sync: false
      - key: REDIS_ENABLED
        value: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SENTRY_DSN
        sync: false
      - key: LOG_DRAIN_URL
        sync: false
      - key: WORKER_ENABLED
        value: true
      - key: BACKUP_S3_BUCKET
        sync: false
    autoDeploy: true
    branch: main
