name: NexoraOS CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build Frontend (Vite)
        run: npx vite build > build.log 2>&1 || true

      - name: Commit build log for inspection
        if: always()
        run: |
          git config user.email "ci@nexoraos.local"
          git config user.name "NexoraOS CI"
          cp build.log ci-build.log
          git add ci-build.log
          git commit -m "ci: attach build log [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"
