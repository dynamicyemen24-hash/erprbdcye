name: NexoraOS CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security Audit (block critical & high vulnerabilities)
        run: |
          npm audit --audit-level=high
        continue-on-error: false

      - name: Dependency Vulnerability Scan (Snyk)
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Secret Scan (fail on leaked credentials)
        run: |
          if grep -rInE "(sk-[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{30,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|postgres://[^:]+:[^@]+@)" \
            src api server.ts --include="*.ts" --include="*.tsx" --include="*.js"; then
            echo "❌ SECRET SCAN FAILED: Leaked credentials found!"
            exit 1
          fi
          echo "✅ Secret scan passed: no leaks found."

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & Integration Tests (with coverage)
        run: npx vitest run --coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nexora_test
          JWT_SECRET: ci-test-secret-key-minimum-32-characters-long

      - name: Build Frontend (Vite)
        run: npm run build:frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build Server Bundle (esbuild)
        run: npm run build:server

      - name: Smoke Test (build verification)
        run: |
          test -d dist || (echo "Build output missing" && exit 1)
          test -f dist/server.cjs || (echo "Server bundle missing" && exit 1)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
